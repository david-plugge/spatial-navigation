<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<style>
			* {
				box-sizing: inherit;
				margin: 0;
				padding: 0;
			}
			body {
				box-sizing: border-box;
				height: 100vh;
				background-color: rgb(50, 50, 50);
				color: #fff;
				margin: 0;
				/* background-image: url(https://picsum.photos/1920/1080); */
				background-image: url(/background.png);
				font-size: 5rem;
			}

			[data-selected] {
				outline: 4px solid rgba(4, 39, 235, 0.8);
				outline-offset: 4px;
			}
			[data-selectedable-mark] {
				background-color: green;
			}

			.h {
				display: flex;
			}
			.v {
				display: flex;
				flex-direction: column;
			}
		</style>
	</head>
	<body>
		<div class="test">
			<div data-selectable>TEST</div>
		</div>

		<div data-selectable-group class="h">
			<div data-selectable>0</div>
			<div data-selectable>1</div>

			<div data-selectable-group>
				<div data-selectable>0</div>
				<div data-selectable data-selected>1</div>
				<div data-selectable>2</div>
				<div data-selectable>3</div>
			</div>

			<div data-selectable>2</div>
			<div data-selectable>3</div>

			<div data-selectable-group>
				<div data-selectable>0</div>
				<div data-selectable>1</div>
				<div data-selectable>2</div>
				<div data-selectable>3</div>
			</div>
		</div>

		<script type="module" src="./src/new/spatial-navigation.ts"></script>
	</body>
</html>
