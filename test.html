<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<style>
			* {
				box-sizing: inherit;
				margin: 0;
				padding: 0;
			}
			body {
				box-sizing: border-box;
				height: 100vh;
				background-color: rgb(50, 50, 50);
				color: #fff;
				margin: 0;
				/* background-image: url(https://picsum.photos/1920/1080); */
				background-image: url(/background.png);
				font-size: 5rem;
			}
			[data-selected] {
				outline: 4px solid rgba(4, 39, 235, 0.8);
				outline-offset: 4px;
			}

			#scroller {
				overflow: hidden;
			}

			[data-scroller-content] {
				position: relative;
				padding: 2rem;
				width: max-content;
				display: flex;
				transition: transform 300ms ease-out;
			}

			.item {
				display: flex;
				justify-content: center;
				align-items: center;
				margin: 0 1rem;
				min-width: 400px;
				height: 300px;
				width: 400px;
				padding: 1rem;
				border: 4px solid rgba(202, 202, 202, 0.7);
				border-radius: 32px;
				background-color: rgba(128, 128, 128, 0.3);
				transition: transform 300ms ease-out;
			}
			.item[data-selected] {
				background-color: rgba(0, 2, 82, 0.549);
				border-color: #fff;
				outline: none;
				/* transform: scale(1.1); */
			}

			.test {
				padding: 1rem;
			}
		</style>
	</head>
	<body>
		<div class="test">
			<div data-selectable>TEST</div>
		</div>

		<div id="scroller" data-scroller>
			<div data-scroller-content data-selectable-group>
				<div data-selectable>0</div>
				<div data-selectable>1</div>

				<div data-selectable-group>
					<div data-selectable>0</div>
					<div data-selectable>1</div>
					<div data-selectable>2</div>
					<div data-selectable>3</div>
				</div>

				<div data-selectable>2</div>
				<div data-selectable>3</div>

				<div data-selectable-group>
					<div data-selectable>0</div>
					<div data-selectable>1</div>
					<div data-selectable>2</div>
					<div data-selectable>3</div>
				</div>
			</div>
		</div>

		<script type="module" src="./src/new/spatial-navigation.ts"></script>
	</body>
</html>
