<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<style>
			body {
				height: 100vh;
				background-color: rgb(50, 50, 50);
				color: #fff;
				margin: 0;
				padding: 2rem;
			}
			[data-selected] {
				outline: 4px solid rgba(4, 39, 235, 0.8);
				outline-offset: 4px;
			}

			#scroller {
				border: 1px solid grey;
				overflow: hidden;
			}

			[data-scroller-content] {
				position: relative;
				padding: 2rem;
				width: max-content;
				display: flex;
				transition: transform 300ms ease-in-out;
			}

			.item {
				margin: 0 1rem;
				min-width: 400px;
				height: 300px;
				width: 400px;
				border: 4px solid rgba(128, 128, 128, 0.5);
				border-radius: 8px;
				background-color: rgba(128, 128, 128, 0.3);
				/* transition:
					background-color 100ms,
					border-color 100ms; */
			}
			.item[data-selected] {
				background-color: rgba(4, 39, 235, 0.6);
				border: 4px solid rgba(4, 39, 235, 0.8);
				outline: none;
			}

			.test {
				padding: 1rem;
			}
		</style>
		
	</head>
	<body>
		<div class="test">
			<div data-selectable>TEST</div>
		</div>

		<div id="scroller" data-scroller>
			<div
				data-scroller-content
				data-selectable-group
				data-selectable-savelast="false"
			>
				<div data-selectable data-selectable-initial class="item">
					0 Lorem ipsum dolor sit.
				</div>
				<div data-selectable class="item">1 Lorem ipsum dolor sit.</div>
				<div data-selectable class="item">2 Lorem ipsum dolor sit.</div>
				<div data-selectable class="item">3 Lorem ipsum dolor sit.</div>
				<div data-selectable class="item">4 Lorem ipsum dolor sit.</div>
				<div data-selectable class="item">5 Lorem ipsum dolor sit.</div>
				<div data-selectable class="item">6 Lorem ipsum dolor sit.</div>
				<div data-selectable class="item">7 Lorem ipsum dolor sit.</div>
				<div data-selectable class="item">8 Lorem ipsum dolor sit.</div>
				<div data-selectable class="item">9 Lorem ipsum dolor sit.</div>
			</div>
		</div>

		<script crossorigin id="vite-legacy-polyfill" src="/polyfills-legacy.js"></script>
		<script crossorigin id="vite-legacy-entry" data-src="/test-legacy.js">System.import(document.getElementById('vite-legacy-entry').getAttribute('data-src'))</script>
	</body>
</html>
